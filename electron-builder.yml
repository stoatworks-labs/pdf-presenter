appId: com.allansargeant.pdf-presenter-lite
productName: PDF Presenter Lite
# Declares this app as a valid .pdf handler at build time (macOS
# CFBundleDocumentTypes, Linux shared-mime-info + .desktop MimeType) — what
# makes "Set as Default PDF App" possible at all on those two platforms.
# Windows self-registers at runtime instead (see defaultPdfHandler.ts):
# this app ships portable-only, so there's no NSIS install step for
# electron-builder's own Windows file-association support to hook into.
fileAssociations:
  - ext: pdf
    name: PDF Document
    description: PDF Document
    mimeType: application/pdf
    role: Viewer
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # pdfjs-dist's optional Node-canvas fallback — we only render via the
  # browser's DOM <canvas> in the renderer, never Node-side. Its prebuilt
  # native binary is arch-specific but only ever installed for whichever
  # arch this repo's npm install ran on, so it ends up byte-identical in
  # both x64 and arm64 packaged trees and breaks the universal-binary merge.
  - '!**/node_modules/@napi-rs/**'
win:
  executableName: pdf-presenter-lite
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
        - arm64
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  createDesktopShortcut: always
portable:
  artifactName: ${name}-${version}-${arch}-portable.${ext}
mac:
  # Standalone (non-universal) arm64/x64 builds otherwise ship completely
  # unsigned, which Gatekeeper on Apple Silicon refuses to launch at all
  # ("is damaged and can't be opened") — the universal build only worked
  # because @electron/universal's lipo merge step happens to leave it
  # validly ad-hoc-signed. identity: null forces electron-builder to
  # ad-hoc sign every target explicitly instead of skipping signing when
  # no Developer ID certificate is installed.
  identity: '-'
  # Ad-hoc plus electron-builder's default hardened runtime fails library
  # validation at launch unless disable-library-validation is granted.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - x64
        - arm64
        - universal
    - target: zip
      arch:
        - x64
        - arm64
        - universal
  category: public.app-category.productivity
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
  maintainer: allansargeant
  category: Office
npmRebuild: false
