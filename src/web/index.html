<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Presenter Lite</title>
    <meta
      name="description"
      content="Present a PDF with a presenter view and a separate fullscreen output. Runs entirely in your browser — the file is never uploaded."
    />
    <!-- Same policy as the Electron renderer, minus nothing: this build makes no
         network requests of its own once loaded. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; worker-src 'self' blob:"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
