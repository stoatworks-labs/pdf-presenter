<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF Presenter Lite</title>
    <meta
      name="description"
      content="Present a PDF with a presenter view and a separate fullscreen output. Runs entirely in your browser — the file is never uploaded."
    />
    <!-- Same policy as the Electron renderer, minus nothing: this build makes no
         network requests of its own once loaded. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; worker-src 'self' blob:"
    />
    <link rel="canonical" href="https://pdf-presenter-lite.stoatworks-labs.com/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Stoatworks Labs">
    <meta property="og:locale" content="en_GB">
    <meta property="og:url" content="https://pdf-presenter-lite.stoatworks-labs.com/">
    <meta property="og:title" content="PDF Presenter Lite">
    <meta property="og:description" content="Present a PDF with a presenter view and a separate fullscreen output. Runs entirely in your browser — the file is never uploaded.">
    <!-- Card hosted on the main site: it is regenerated in place by the
         website's make_thumbnails.py and keeps its filename, so a copy
         vendored here would go stale without anything saying so. -->
    <meta property="og:image" content="https://stoatworks-labs.com/thumbs/pdf-presenter-lite-web.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1280">
    <meta property="og:image:height" content="720">
    <meta property="og:image:alt" content="PDF Presenter Lite">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://stoatworks-labs.com/thumbs/pdf-presenter-lite-web.png">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
    <!--
      About dialog. Both files are vendored from stoatworks-backend/about and
      generated by its sync-about.py — edit them there, never here. Classic +
      defer: about-data.js only sets defaults, so it and the app's own startup
      can load in either order.
    -->
    <script src="/about-data.js" defer></script>
    <script src="/about.js" defer></script>
  </body>
</html>
